noddp: true
distributed_backend: gloo
trainer: energy

dataset:
  - src: /scratch/gameelka/deltaML_project/lmdb_files/tmqm_bob_residuals/tmqm_bob_residuals_train.lmdb
    normalize_labels: True
    target_mean: 5.197649620533907e-05
    target_std: 0.0673376126137906
  - src: /scratch/gameelka/deltaML_project/lmdb_files/tmqm_bob_residuals/tmqm_bob_residuals_val.lmdb
  - src: /scratch/gameelka/deltaML_project/lmdb_files/tmqm_bob_residuals/tmqm_bob_residuals_test.lmdb

logger: tensorboard

cmd:
  identifier: gemnet_train_on_bob_residuals

task:
  dataset: single_point_lmdb
  qm9_target: 0
  description: "Delta Energy DFT-xTB."
  type: regression
  metric: mse
  labels:
    - relaxed energy
  train_is_only: False
  val_is_only: False

model:
  name: gemnet_t
  num_spherical: 7
  num_radial: 128
  num_blocks: 3
  emb_size_atom: 512
  emb_size_edge: 512
  emb_size_trip: 64
  emb_size_rbf: 16
  emb_size_cbf: 16
  emb_size_bil_trip: 64
  num_before_skip: 1
  num_after_skip: 2
  num_concat: 1
  num_atom: 3
  cutoff: 6.0
  max_neighbors: 50
  rbf:
    name: gaussian
  envelope:
    name: polynomial
    exponent: 5
  cbf:
    name: spherical_harmonics
  extensive: True
  output_init: HeOrthogonal
  activation: silu
  scale_file: /scratch/gameelka/deltaML_project/train/scaling_factors/gemnet-dT.json
  regress_forces: False
  direct_forces: False
  use_pbc: False
  otf_graph: True

optim:
  batch_size: 4
  eval_batch_size: 4
  eval_every: 5000
  num_workers: 2
  lr_initial: 5.e-4
  optimizer: AdamW
  optimizer_params: {"amsgrad": True}
  scheduler: ReduceLROnPlateau
  mode: min
  factor: 0.8
  patience: 3
  max_epochs: 80
  force_coefficient: 100
  energy_coefficient: 1
  ema_decay: 0.999
  clip_grad_norm: 10
  loss_energy: mse
  loss_force: l2mae

