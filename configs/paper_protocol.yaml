paper:
  title: "The Mechanics of Delta Learning: Target Design for Generalizable Scientific Machine Learning"
  version: "0.2.0-corrected"
  target_generation: train_only_fits_frozen_for_validation_and_test

roughness:
  primary_split: test
  primary_graph_molecules: 7104
  dftb_valid_graph_molecules: 7068
  gemnet_proxy: PRE+A
  schnet_proxy: PRE
  feature_scaling: population_standard_deviation_without_centering
  distance_metric: cosine
  k: 10
  graph: undirected_union
  edge_weighting: locally_scaled_gaussian
  target_normalization: squared_interquartile_range

pre:
  cutoff_angstrom: 6.0
  short_range_centers_angstrom:
    start: 0.8
    stop: 3.0
    step: 0.1
  long_range_centers_angstrom:
    start: 3.25
    stop: 6.0
    step: 0.25
  short_range_sigma_angstrom: 0.12
  long_range_sigma_angstrom: 0.30
  feature_count: 34650

angular:
  radial_shell_edges_angstrom: [0.0, 1.3, 1.8, 2.3, 3.0, 4.2, 6.0]
  angle_coordinate: cosine
  angle_bins: 12
  central_elements: 44
  feature_count: 11088

pre_plus_a:
  feature_count: 45738

evaluation:
  checkpoint_selection: best_validation_mae
  validation_role: checkpoint_selection_and_learning_rate_scheduling_only
  tmqm_split: test
  tmqm_primary_seeds: [101, 102, 103]
  qm9_primary_seeds: [101, 102, 103]
  uncertainty: independent_seed_sample_standard_deviation
  uncertainty_is_not: ensemble_prediction_error
  dftb_role: supporting_control
  dftb_seed: 101
  dftb_excluded_from_pooled_statistics: true
