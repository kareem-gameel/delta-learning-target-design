noddp: true
distributed_backend: gloo
trainer: energy
dataset:
- src: /scratch/gameelka/deltaML_project/lmdb_files/tmqm_delta_xtb_ref_boe/tmqm_delta_xtb_ref_boe_test.lmdb
- src: /scratch/gameelka/deltaML_project/lmdb_files/tmqm_delta_xtb_ref_boe/tmqm_delta_xtb_ref_boe_test.lmdb
- src: /scratch/gameelka/deltaML_project/lmdb_files/tmqm_delta_xtb_ref_boe/tmqm_delta_xtb_ref_boe_test.lmdb
logger: tensorboard
cmd:
  identifier: delta_xtb_ref_boe_seed_101
  seed: 101
task:
  dataset: single_point_lmdb
  qm9_target: 0
  description: DFT-minus-xTB after reference correction and BoE removal.
  type: regression
  metric: mse
  labels:
  - relaxed energy
  train_is_only: false
  val_is_only: false
model:
  name: gemnet_t_clean_export
  num_spherical: 7
  num_radial: 128
  num_blocks: 3
  emb_size_atom: 512
  emb_size_edge: 512
  emb_size_trip: 64
  emb_size_rbf: 16
  emb_size_cbf: 16
  emb_size_bil_trip: 64
  num_before_skip: 1
  num_after_skip: 2
  num_concat: 1
  num_atom: 3
  cutoff: 6.0
  max_neighbors: 50
  rbf:
    name: gaussian
  envelope:
    name: polynomial
    exponent: 5
  cbf:
    name: spherical_harmonics
  extensive: true
  output_init: HeOrthogonal
  activation: silu
  scale_file: /scratch/gameelka/deltaML_project/train/scaling_factors/gemnet-dT.json
  regress_forces: false
  direct_forces: false
  use_pbc: false
  otf_graph: true
  embedding_export:
    enabled: true
    output_dir: /scratch/gameelka/gemnet_embedding_exports_2026_06/manifest_exports/test/delta_xtb_ref_boe
    split_name: test
    model_tag: delta_xtb_ref_boe
    flush_every_batches: 100
    mol_id_filter_file: null
optim:
  batch_size: 4
  eval_batch_size: 4
  eval_every: 5000
  num_workers: 2
  lr_initial: 0.0005
  optimizer: AdamW
  optimizer_params:
    amsgrad: true
  scheduler: ReduceLROnPlateau
  mode: min
  factor: 0.8
  patience: 3
  max_epochs: 80
  force_coefficient: 100
  energy_coefficient: 1
  ema_decay: 0.999
  clip_grad_norm: 10
  loss_energy: mse
  loss_force: l2mae
submit: false
summit: false
identifier: predict_export_clean_delta_xtb_ref_boe_test
val_dataset:
- src: /scratch/gameelka/deltaML_project/lmdb_files/tmqm_delta_xtb_ref_boe/tmqm_delta_xtb_ref_boe_test.lmdb
test_dataset:
- src: /scratch/gameelka/deltaML_project/lmdb_files/tmqm_delta_xtb_ref_boe/tmqm_delta_xtb_ref_boe_test.lmdb
